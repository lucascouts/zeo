#
# Two kinds of entry:
#   - OBSERVED  (`failed: true`)        — the test was run in Phase 3 and failed for
#                                         the recorded reason. Quoted output is real.
#   - DEFERRED  (`red_deferred: true`)  — the test was NOT run in Phase 3. The four
#                                         Rust tests live inside `fork/`, and Phase 3
#                                         is forbidden from writing there; a full
#                                         debug rebuild would also be thrown away.
#                                         The executor materialises each test, RUNS
