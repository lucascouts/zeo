  - task: "5.4"
    component: "test authorship — Test Advisor ran at RUN time, not at Phase 3"
    design: >-
      Full mode pre-authors every test at Phase 3 (Test Advisor -> `.draft/authored-tests/` ->
      materialised by the orchestrator at Run step 7).
    actual: >-
      5.4 was born during the v2 REFINE pass, after Phase 3 had already closed, so it had no
      pre-authored test and nothing in `.draft/authored-tests/` to materialise. The orchestrator
      spawned the Test Advisor at RUN time to author the three new tests into the EXISTING
      `zeo_theme.rs`, confirmed the Red itself (`cargo` exit 101, 11 of 16 pairs below floor,
      headline `border.variant` on `elevated_surface` at 1.00:1), and only then handed the file
      to the Executor as a frozen read-only input.
    reason: >-
      The alternative was a test-AFTER Executor writing both the fix and the assertion that judges
      it. This story has already been bitten three times by exactly that shape of hole (the missing
      D24 assertion, the missing `modal_surface` assertion, the missing border assertion that
      PRODUCED this sub-task) — every one of them found by someone other than the author. Separating
      the author of the assertion from the author of the fix is the control that keeps catching them.
      It is also the only way to get a genuinely OBSERVED Red here: the broken `zeo.json` was still
      in the tree, so a test written before the fix went red on its own, with no staging.
    impact: >-
      Strictly stronger, and cheap (the crate was already warm). Recommendation for future refine
      passes: a sub-task added at refine SHOULD get a Test Advisor pass at run time. The Phase 3
      boundary is an artefact of when the plan was written, not a property of the work.

