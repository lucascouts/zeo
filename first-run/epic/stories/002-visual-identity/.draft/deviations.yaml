    actual: "Task 5 is sequenced AFTER Task 3 and is NOT parallelised."
    reason: >-
      The declaration contradicts D25. Task 3.0 adds the `modal_surface_background` field
      to `ThemeColors` and to the theme JSON schema; the Zeo theme authored in 5.1 must SET
      that field, or D7's four-level ladder has no colour for `e3` to step to and the theme
      ships a three-level ladder. A `zeo.json` written before 3.0 could not carry the key.
      Task 5 therefore depends on Task 3, not on nothing.
    impact: >-
      Sequential execution (1 -> 2 -> 3 -> 4 -> 5) already satisfies this; no reordering
      was needed. 5.1's Executor is explicitly instructed to set `modal_surface.background`
      in both variants. Recorded so the (false) parallelism claim is not acted on later.

