  - task: "5.1"
    tech: "colour science / design.md ERRATUM"
    finding: >-
      **design.md's elevation table is in CIE L*, but it LABELS the column "relative luminance" — and the
      frozen test measures WCAG relative luminance (Y).** The two diverge hard at the dark end: D7's literal
      "+2-3 L*" for e1 computes to ~0.006 Y, which is HALF the test's `MIN_LUMINANCE_STEP` floor of 0.01 Y.
      Sizing the rungs to D7's stated numbers would have FAILED the test that D7 exists to satisfy. The
      Executor sized every rung to clear 0.01 Y (approx +4 L*), satisfying both the test and D7's intent.
      **design.md should be corrected at the gate.**
  - task: "5.1"
    tech: "colour data / design.md ERRATUM"
    finding: >-
      **Research finding 2 is UNDERSTATED in design.md.** `elevated_surface.background` and
      `surface.background` are not "+0.2% apart" — they are the IDENTICAL STRING (`#2f343eff` dark,
      `#ebebecff` light). The step is exactly 0.0000. The +0.002 figure design.md cites belongs to a
      DIFFERENT pair (`element.background` #2e343e -> `surface` #2f343e). The elevated rung does not
      merely fail to be visible; it does not exist.
  - task: "5.1"
    tech: "theme loading — a silent-failure trap"
    finding: >-
      **`zeo.json` MUST stay strict JSON.** The BUNDLED theme loader uses `serde_json::from_slice`
      (`theme_settings.rs:242`), NOT the lenient parser that `deserialize_user_theme` (and therefore the
      test) uses. A comment or trailing comma would PASS the test suite and then fail SILENTLY in the app
      — log-only, falling back to One Dark. Same class of trap as the theme-name mismatch (R3.6), and it
      would be found only by launching the binary. Verified strict with `jq empty`.
  - task: "4.1"
    tech: "gpui radius literals"
    finding: >-
      **GPUI's `.rounded_md()` and friends are REM-BASED, so they already scale with `ui_font_size`.**
      This means a test that varies only `ui_font_size` CANNOT distinguish the Zeo token from the literal
      it replaced — the mutation passed at both 16 and 20. The ONLY lever that separates them is
      `zeo.radius_scale`, which the literal cannot see. Any future token-coverage test (story 003 will
      write many) MUST vary `zeo.radius_scale` to be non-vacuous. This was found empirically by the
      4.1 Executor's mutation proof and is the single most transferable lesson of this task.
  - task: "3.2"
    tech: "call-site inventory"
    finding: >-
      The chokepoint re-skins **71 call sites across 47 files**, not the 55/45 the plan states (the
      difference is the `_borderless` variants). Zero were modified — R2.6 holds. Also: the command
      palette has no `elevation_*` call of its own; it inherits its surface via
      `Picker::uniform_list` -> `picker/src/render.rs:68 .elevation_3(cx)`, landing on `ModalSurface`
      -> `Xl` (12px), exactly as design.md prescribes.
  - task: "3.2"
    tech: "toasts"
    finding: >-
      `notifications/src/status_toast.rs:83` calls `.elevation_3(cx)`, so toasts now inherit the MODAL
      background and the modal radius (Xl, 12px) rather than the popover's Lg. That follows from the
      pre-existing call site, not from the conversion, and correcting it would mean touching a call site
      (forbidden by R2.6). If the design wants toasts at e2, that is a deliberate call-site change for
      story 003. Flagged, not fixed.
  - task: "2.2"
    tech: "gpui / DynamicSpacing"
    finding: >-
      The formula, confirmed and mirrored (`ui_macros/src/dynamic_spacing.rs:146-162`):
      `ratio = nominal_px / 16.0` (the rem base lives ONLY here), then
      `px() = px(ui_font_size × ratio)` — never `16 × ratio`. `ZeoRadius` mirrors this exactly,
      minus the density arm (D21), and multiplies the ratio by the already-clamped
      `zeo_radius_scale`. An implementation that hard-codes the 16px base compiles and passes
      every other assertion in the file — which is why `steps_scale_with_ui_font_size_not_with_a_fixed_16px_base`
      exists. It passes.
  - task: "1.1"
    tech: "grim / KWin"
    finding: >-
      **BLOCKER FOR PHASE C (1.2 and 7.1), verified by the orchestrator, not just claimed.**
      `grim` CANNOT CAPTURE on this host: `grim -g '0,0 1x1' out.png` ->
      "compositor doesn't support the screen capture protocol", exit 1, no file written.
      KWin does not implement the `wlr-screencopy` protocol that grim requires. Every real
      `shot.sh` invocation will therefore fail at the capture step (loudly, and with no
      zero-byte PNG — the harness behaves correctly; the backend is simply dead).
      `spectacle` 6.7.2 IS installed, and design.md §9 already names it as the intended
      fallback ("or per-window via `spectacle`") — the DESIGN anticipated this; the
      pre-authored test did not (it pins `grim` in its shims and assertions).
      Swapping the backend to spectacle therefore changes what the frozen test's assertions
      expect => it is a BEHAVIOUR-CHANGING change and must be escalated to the user, NOT
      resolved by an executor. Deferred to Phase C, where the user is present.
      Sub-task 1.1 remains legitimately GREEN: it satisfies its contract as written.
  - task: "1.1"
    tech: "test coupling"
    finding: >-
      Scenario s2 of the frozen test ("grim missing -> loud failure") passes on this host for
      a HOST-SPECIFIC reason: its shim dir omits `grim`, but PATH still contains /usr/bin, so
      the script finds the REAL grim — which exits non-zero only because KWin cannot
      screencopy. On a wlroots host the same scenario would capture the real screen and s2
      would go RED. Latent coupling inside the frozen test; unfixable without editing it.
  - task: "run-mode"
    tech: "environment"
    finding: >-
      Synthetic input is UNAVAILABLE for driving GPUI surfaces: `slurp` absent (anticipated
      by the plan), and also `wtype` absent, `ydotoold` not running, `/dev/uinput` is
      root-only (crw------- root root), the user is not in the `input` group, and `xdotool`
      cannot drive a native Wayland client. Only "editor at rest" is reachable by launching
      the binary with a file. `ydotool` IS installed — enabling it needs only a daemon
      (`sudo ydotoold`), no package install. Decision deferred to capture time (user's
      choice); `scripts/shot.sh` is therefore built with a PLUGGABLE driver step that fails
      loudly when a surface needs input the host cannot synthesise.
  - task: "run-mode"
    tech: "cargo / fork"
    finding: >-
      `fork/target/debug` is already 133 GB (warm) and `target/release` 32 GB. Red
      confirmation via `cargo test` is incremental, not a cold build. ALWAYS `cd fork`
      first — cargo reads `.cargo/config.toml` from the CWD, and `--manifest-path` from the
      workspace root silently drops the fork's rustflags (docs/BUILD.md).
  - task: "1.2 / 1.3"
    tech: "screen capture — THE SILENT FAILURE, and it nearly shipped"
    finding: >-
      **A capture taken while the desktop session is LOCKED is not a failed capture. It is a
      SUCCESSFUL capture of nothing.** KWin does not paint the contents of windows the lock
      screen occludes, so `spectacle -a` returns a correctly-sized, non-zero, perfectly
      decodable PNG of an EMPTY pane, and exits 0.
      Every guard in the harness waves it through — and the harness was BUILT to catch exactly
      this class of thing. The file is non-empty (s2's contract). It decodes (s1's). The
      geometry pair-check (s7) passes, because BOTH passes are equally blank. There is nothing
      in the artefact that says "this is a picture of nothing", so **no check placed after the
      capture can ever work**. The probe has to run in preflight, before a window is launched.
      HOW IT WAS CAUGHT — worth recording, because it was luck. The run produced flawless empty
      PNGs. TWO INNOCENT CAUSES WERE BLAMED AND "FIXED" FIRST (the trust modal, then `--settle`);
      both were wrong. It took a FULL-SCREEN capture, taken outside the harness for an unrelated
      reason, to see the lock screen. Without that accident, six blank PNGs would have been
      committed as story 002's visual evidence and the before/after pairs would have compared
      nothing to nothing.
      FIXED: `scripts/shot.sh` probes `loginctl … LockedHint` in preflight and dies. It fails
      OPEN when loginctl is absent, which is what keeps the hermetic suite hermetic. Scenario 9
      supplies a `loginctl` that reports locked and asserts the run dies before the launch with
      no PNG at all; its mirror asserts an unlocked session still captures, so the guard cannot
      degrade into a blanket refusal.
      **FOR STORY 003 (which will capture the chrome): the operator must be present and the
      session unlocked. This is now enforced, not merely documented.**
  - task: "1.2"
    tech: "Zed's trust modal — it would have corrupted every DRIVEN surface"
    finding: >-
      A throwaway config dir makes the fixture an UNTRUSTED worktree, so Zed raises its
      "Unrecognized Project / Restricted Mode" modal over the editor. Two consequences, and the
      second is the one that matters: it covers the surface the capture exists to show, and it
      **HOLDS FOCUS** — so every `--keys` chord would have been delivered to the MODAL instead
      of the editor. All five driven surfaces (command palette, file picker, popover, modal,
      button row) would have captured the wrong thing under the right filename, in both passes,
      consistently. The pair-check would not have blinked.
      FIXED declaratively via `session.trust_all_worktrees: true` in the throwaway settings
      (`settings_content/src/project.rs:389` → `trusted_worktrees.rs:469`). Sending `enter` to
      dismiss it would also work, but only for as long as the keystroke lands — the kind of
      thing that fails once and is never noticed.
      **The key PREDATES story 002** (verified present at the baseline commit `b05f68f9be`), so
      the banked pre-change binary parses it too. Had it not, the whole settings file would have
      been rejected and the THEME would have gone silently unpinned — the same class of trap one
      rung down, and the exact failure mode the `ThemeSelection` deviation already warns about.
  - task: "5.4"
    tech: "zeo.json — a find/replace trap"
    finding: >-
      **The border hexes are SHARED with unrelated keys. A hex-level find/replace on `zeo.json`
      would have silently repainted other tokens.** `#e4e3eb` (Zeo Light `border.variant`) appears
      **6 times** in the file — it is also `element.hover` and `ghost_element.hover`. `#cecbd8`
      appears 4 times; `#524f62` and `#403d4d` 3 times each. The 5.4 Executor found this while
      scoping the edit and matched on the **key+value line** instead, verifying each of the four is
      unique at that granularity. Anyone repainting this palette (story 003 will) must do the same:
      a palette JSON is not a place where `sed s/#hex/#hex/g` is safe, and the failure would be
      silent — it compiles, it parses, and only the eye catches it.
  - task: "5.4"
    tech: "colour science / the shape of the fix"
    finding: >-
      **Zeo Light was the harder half, and the story never said so.** The defect was framed
      throughout as a dark-mode elevated-surface problem (the 1.00:1 hairline). But 6 of the 11
      violations were in Zeo Light, and the one nobody predicted is that `border` failed against the
      light **canvas itself** (e0) at 1.19:1 — the bottom of the light ladder had no structural border
      at all, independently of anything story 002 did. The ladder did not cause the light defect; it
      widened a gap that was already there. Upstream One Light shipped it.
  - task: "5.4"
    tech: "the equilibrium is tight, ON PURPOSE — read this before repainting"
    finding: >-
      **4 of the 16 pairs clear their floor by under 0.003, and all four sit at the ladder's
      extremes** (Zeo Light `border.variant` on `background` +0.0011; Zeo Dark `border.variant` on
      `modal` +0.0014; Zeo Dark `border` on `modal` +0.0019; Zeo Light `border` on `background`
      +0.0031). That is the "no margin wasted" the plan asked for, and it is the unavoidable geometry
      of ONE token spanning FOUR rungs — push a border further from one end of the ladder and it
      approaches the other.
      CONSEQUENCE: **any future repaint of the canvas or modal rung, in either variant, flips the
      16-pair sweep red without a border being touched.** That is the sweep working as designed, not
      the sweep being brittle — but whoever hits it should re-derive the BORDERS against the new
      ladder rather than assume they broke something. Verified safe against f32: the smallest margin
      is ~10^4x the f32 epsilon at that magnitude, so there is no rounding hazard, only a design one.
