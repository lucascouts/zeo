    impact: >-
      Surface-only; assertions frozen. RECOMMENDATION for the remaining pre-authored tests in this
      story: the test author should carry `use gpui::UpdateGlobal;` +
      `use settings::{ParseStatus, SettingsStore};` and the `matches!` form into the template. Three
