    tech: "downstream regression"
    finding: >-
      The `--auto` block validated only the 4 crates it edited, while the chokepoint changed the
      RENDERED BEHAVIOUR of 71 call sites across 14 other crates. That gap was closed after the fact:
      `cargo test` was run across every crate that consumes `elevated()` / `elevation_1|2|3` —
      editor (832), agent (~690), agent_ui (419), workspace (219), sidebar (140), git_ui (137),
