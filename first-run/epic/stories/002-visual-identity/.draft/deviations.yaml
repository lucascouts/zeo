          `use settings::ParseStatus;`, message preserved verbatim.
      Both edits are confined to the `write_user_settings` FIXTURE helper and the import block.
      NOTE — the (c) "ui_font_size 14 vs 16" premise bug of 2.1/2.2 does NOT recur here: this
