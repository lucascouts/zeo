  - task: "post-run verification"
    tech: "rustfmt"
    finding: >-
      `cargo fmt --check` is RED on this fork, and was already red before story 002. Root cause is
      uniform: code written or patched BY HAND and never run through rustfmt.
      Story 002 contributed 5 files — all of them the PRE-AUTHORED TEST files, hand-written at plan
