    test_surface_adjusted: true

  - task: "3.2"
    component: "the D24 assertion — MISSING from the pre-authored test"
    design: >-
      tasks.md 3.2 demands, in bold: "the assertion that pins D24 — that the background equals
      `index.bg(cx)`, differing across `elevation_1`/`_2`/`_3`. A weaker `background.is_some()`
      assertion passes against today's broken helper and MUST NOT BE ACCEPTED."
    actual: >-
      The pre-authored test contained PRECISELY the forbidden assertion — `style.background.is_some()`
      — and nothing else about the background. The orchestrator caught this and directed the Executor
      to ADD a new test, `elevated_resolves_its_background_from_the_index`, which injects a synthetic
      theme whose surface/elevated/modal backgrounds are three distinct colours, then asserts each
      level's background equals that index's `bg(cx)` and that the three are pairwise distinct.
    reason: >-
      D24/R2.2 — the THIRD DEFECT and the entire reason sub-task 3.2 exists — was UNASSERTED. The test
      author's module doc rationalised it away ("the background step is NOT asserted here and CANNOT
      be"), conflating two different claims: the luminance-step VALUE (genuinely untestable in
      `crates/ui` — One Dark has elevated == surface by data) with the MECHANISM (does the helper ask
      the enum?). The mechanism IS testable, by injecting a theme — the machinery was already in the
      file (`GlobalTheme::update_theme`).
    impact: >-
      PROVEN NECESSARY BY MUTATION. With the background hard-coded but the radius and rim fixed — i.e.
      the exact "looks done, renders flat" implementation — ALL FIVE pre-authored tests pass and only
      the new test fails (`left: l=0.16 (elevated) / right: l=0.10 (what Surface.bg says)`). Without
      it, `ElevationIndex::bg()` would have stayed dead code, and 5.1's palette would have rendered
      completely flat while the suite was green.

  - task: "3.2"
    component: "ElevationIndex::bg() signature"
    design: "design.md: `ElevationIndex::{shadow, bg}` keep their signatures."
    actual: "`bg()` widened from `&mut App` to `&App`."
    reason: >-
      UNAVOIDABLE. The ToDo mandates calling `index.bg(cx)` inside `elevated()`, which holds only
      `&App` — and `elevated`'s signature is frozen by 71 call sites. `&mut App` cannot be obtained
      from `&App`, so one signature had to give, and it could not be the helper's. `bg()` only reads
      `cx.theme().colors()`; `&mut` was never needed.
    impact: >-
      A WIDENING — strictly more permissive; every existing caller still compiles (verified
      workspace-wide, incl. `workspace/src/theme_preview.rs`). It also makes the enum uniform: every
      sibling accessor (`shadow`, `rim`, `on_elevation_bg`, `darker_bg`) already took `&App`.

  - task: "4.1"
    component: "THE COVERAGE GREP IS BROKEN — it cannot see per-corner literals"
    design: >-
      tasks.md 4.1 Validation and the 7.2 gate row both use:
      `grep -cE '\.rounded_(xs|sm|md|lg|xl|2xl|3xl|full)\(\)'` and require 0.
    actual: >-
      That pattern does NOT match the PER-CORNER literal forms — `.rounded_tl_md()`, `.rounded_tr_md()`,
      `.rounded_br_md()`, `.rounded_bl_md()` — which are EXACTLY what `button_like.rs:753-756` uses (the
      very lines the sub-task's own Context field points at). The grep returns 0 against a file still
      full of literals. **The story's official token-coverage gate is blind to the one file it most
      needs to see.**
    reason: >-
      Found the hard way. The Executor's mutation proof re-introduced the per-corner literals, the
      official grep still returned 0, and only the authored unit test failed. The corrected pattern is:
      `grep -cE '\.rounded_((tl|tr|br|bl)_)?(xs|sm|md|lg|xl|2xl|3xl|full)\(\)'`
    impact: >-
      **THE 7.2 GATE MUST USE THE CORRECTED PATTERN.** Verified 0 under the corrected grep for all three
      converted files: `styled_ext.rs`, `button_like.rs`, `toggle.rs`. This is the second independent
      hole tasks.md's own warning predicted in spirit ("the single thing 4.1 can get wrong is the single
      thing the grep cannot see") — it was truer than its author knew.

  - task: "4.1"
    component: "R2.7 contradicts design.md's own radius role table"
    design: >-
      R2.7: "WHEN a button or TOGGLE is rendered THE SYSTEM SHALL obtain its radius from the Zeo token
      at the `md` (6px) step (D9)."
    actual: >-
      Button -> `Md` (6px), as required. But checkbox -> `Sm` (4px), and the switch's frame/track/thumb
      and the placeholder dot -> `Full` (pill).
    reason: >-
      R2.7's text contradicts design.md's §Radius ROLE TABLE, which is the authority and assigns
      `full` (9999) to "avatars, pills, TOGGLES" and `sm` (4) to "tags, badges, CHECKBOXES". The table
      is right and R2.7's prose is loose: a switch IS a pill, and a 6px switch track/thumb would be
      visually broken — the knob is a circle.
      **RETRACTED at v2 — the sentence that used to close this field.** It read: "The conversion
      therefore PRESERVES each control's existing visual step while re-pointing it at the token; it
      changes the substrate, not the appearance." That is FALSE, and the Auditor caught it against the
      diff: checkbox 2px -> 4px (`.rounded_xs()` -> `Sm`, and the code comment admits it — "a deliberate
      step UP from the 2px this box used to hard-code"), button 4px -> 6px (`.rounded_tl_sm()` x4 -> `Md`),
      ModalSurface 8px -> 12px (`.rounded_lg()` -> `Xl`). The appearance DID change. Each change is
      correct per the role table — but the ruling must not rest on a false premise.
    impact: >-
      R1.2 (no literals) and the token-driven substrate hold for every control.
      AUDITOR'S RULING (v2): **for the implementation; R2.7's prose is defective and has been amended.**
      The decisive argument is one this entry missed — **R2.7 cites D9 as its authority, and D9 says
      NOTHING about a step.** D9 reads, in full: "Pilot 2 — `button_like.rs` + `toggle.rs` (churn 3 each).
      Covers every button and toggle in the app." R2.7 conflated *which files the pilot converts* with
      *which step they get*; the citation does not support the clause. Further, design.md declares the
      Visual Language section the arbiter ("if a later change contradicts a statement here, the statement
      — not the change — is wrong until amended"), and a literal R2.7 would violate principle 5 ("a family
      per role, never one value everywhere"). story.md R2.7 now defers to the role table.

