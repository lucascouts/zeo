  - task: "5.4"
    component: "the distinctness assertion — ADDED beyond the Tests field"
    design: >-
      5.4's Tests field lists two sweeps: the 16-pair border floor sweep (R3.10) and the
      `border.focused` sweep (R3.9). The ToDo separately carries a GOTCHA — "keep the two tokens
      distinct" — but no test was specified for it.
    actual: >-
      A third test was authored, `the_two_border_tokens_remain_distinct_colours_in_both_variants`,
      guarding it via the file's existing `same_color()` helper.
    reason: >-
      Without it, the CHEAPEST way to make the 16-pair sweep pass is to collapse both tokens onto one
      bright value. The Test Advisor wrote the guard as a theoretical anti-cheat and then found the
      cheat was genuinely tempting: the two tokens sit only ~1.16:1 apart TODAY, so "one value clears
      everything" is a real local optimum. Collapsing them destroys the prominence hierarchy that 162
      `border` and 127 `border_variant` call sites consume — an invisible-hairline regression traded
      for a flat-border one. Adding coverage is permitted; the frozen-test rule forbids modifying
      existing assertions, not adding new ones.
