  - task: "5.1"
    component: "THE BORDERS WERE LEFT INSIDE THE LADDER — a regression 5.1 introduced"
    design: >-
      R2.1/D7: an elevated surface is separated from the one beneath by BOTH a background
      luminance step AND a hairline border. design.md's Testing Strategy demanded "boundaries
      clear 3:1", noting it is "computable directly from the theme JSON — no rendering needed",
      and the D20 gate table repeated it.
    actual: >-
      The luminance step shipped; the hairline did not. `border.variant` was left at `#403d4d`
      while 5.1 built the ladder around it — so it is now LIGHTER than e1 (#363443), BYTE-ADJACENT
      to e2 (#403d4f — contrast **1.00:1**), and DARKER than e3 (#49465b). It crosses the ladder
      instead of clearing it and collapses to nothing exactly at the elevated surface.
      `border` is barely better: 1.15:1 against modal. In Zeo Light, `border.variant` is 1.05:1
      against the app background.
      NOT caught by any test: the "boundaries 3:1" clause was silently narrowed to "the accent
      clears AA" when design.md was transcribed into tasks.md (at 5.1's Tests line AND at the 7.2
      gate row), so nothing ever asserted a border. All 7 pre-authored tests were green.
    reason: >-
      A latent trap in the upstream palette that only springs once you fix the thing this story
      exists to fix. Upstream One Dark's ladder is FLAT (`surface` == `elevated` == `#2f343eff`,
      research finding 2), so a single fixed `border.variant` sat consistently above ALL of it and
      the crossing was impossible. **Story 002 created the ladder and did not move the border.**
      This is a self-inflicted regression, not an inherited defect — and it is the SAME CLASS of
      defect as D24 (a mechanism that silently paints the wrong thing while the suite stays green).
    impact: >-
      SEVERE, and it lands on the story's headline feature. The chokepoint paints `border_variant`
      on every elevated surface (`styled_ext.rs:43`), so the invisible hairline is not one widget —
      it is all **71 re-skinned call sites**: every picker, command palette, popover, context menu
      and toast. R2.1 demands step AND hairline; what shipped has only the step.
      FIXED at v2 by new sub-task **5.4** (Task 5 reopened): `border` -> `#636077` (dark) / `#b9b4c7`
