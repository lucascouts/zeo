  - task: "1.1"
    component: "scripts/shot.sh — surface driver"
    design: >-
      The orchestrator's ruling asked for a surface->driver MAP applied automatically
      (e.g. `--surface command-palette` implies sending ctrl+shift+p via ydotool).
    actual: >-
      The driver is plugged in at the CALL SITE via a repeatable `--keys <chord>` flag.
      The surface->chord registry survives as suggested chords in `--help` plus a loud
      WARN when a non-`editor` surface is captured with no `--keys`.
    reason: >-
      An auto-map is UNIMPLEMENTABLE against the frozen test. Scenario s1 drives
      `--surface command-palette` with NO keys and asserts exit 0 plus two PNGs — on a host
      where ydotool is provably unusable. An auto-map would make s1 red, and the only way to
      "fix" that would be to edit an assertion, which the frozen-test rule forbids.
    impact: >-
      The ruling's TEETH are preserved exactly where it put them: when a driver IS requested
      (`--keys`) and ydotool/ydotoold is unusable, the script exits non-zero BEFORE launching,
      names the surface and the missing capability, writes no PNG and leaves no window.
      RESIDUAL RISK for Phase C: forgetting `--keys` yields an at-rest PNG under a driven
      surface name. Mitigated by the WARN, not by a hard error (a hard error is impossible
      without editing s1). **Phase C must pass `--keys` explicitly for every driven surface.**
    test_surface_adjusted: false

  - task: "1.1"
    component: "scripts/shot.sh — appearance pinning"
    design: "tasks.md/design.md say the throwaway settings.json pins the APPEARANCE per pass."
    actual: >-
      The script pins the theme NAMES too (`--theme-light` / `--theme-dark`, defaulting to
      the stock `One Light` / `One Dark`), not merely `\"mode\"`.
    reason: >-
      `ThemeSelection` (fork/crates/settings_content/src/theme.rs:274-287) is
      `#[serde(untagged)]` and its `Dynamic` variant requires BOTH `light` and `dark`; only
      `mode` carries `#[serde(default)]`. A settings file containing just `{\"mode\":\"light\"}`
      fails to deserialise, which rejects the WHOLE user settings file — so the appearance
      would be SILENTLY not pinned, and R5.1's "same fixture" guarantee would be void.
    impact: >-
      Strictly stronger. The script also warns when `--label after` still carries the stock
      One Light/One Dark names — a guard against capturing the "after" pass against the old
      theme. Phase C must pass `--theme-light 'Zeo Light' --theme-dark 'Zeo Dark'` for the
      `after` pass.

  - task: "2.1"
    component: "backing store for the `zeo` settings group"
    design: >-
      design.md component 2 says: extend the `ThemeSettingsProvider` trait and implement on
      `ThemeSettingsProviderImpl`.
    actual: >-
      The accessor lives on the trait and its impl EXACTLY as designed. But the settings are
      backed by a NEW `ZeoSettings` `Settings` impl (`crates/theme_settings/src/zeo.rs`)
      rather than a field on `ThemeSettings`.
    reason: >-
      STRUCTURAL. `zeo` is a nested TOP-LEVEL settings key (`{"zeo": {"radius_scale": …}}`),
      whereas `ThemeSettings::from_settings` opens by rebinding `let content = &content.theme;`
      — it reads the FLATTENED `ThemeSettingsContent` fields, which land at the ROOT of
      settings.json (`ui_font_size`, `theme`, …). A nested object is not one of those and does
      not belong inside `ThemeSettingsContent`. It is a sibling group on `SettingsContent`
      (exactly like `title_bar`), so its natural reader is its own `Settings` impl.
      NOTE — the Executor originally justified this with a churn figure ("settings.rs churn
      141, the hottest relevant file"). **That figure is RETRACTED.** The orchestrator
      measured it: 6-month churn is 14, and `theme_settings.rs` is 9 — comparable, not 15x
      hotter. The Executor had counted ALL history, not the 6-month window. The churn argument
      does NOT support this deviation and has been withdrawn from both the register and a code
      comment it had been baked into. The structural reason above is the sole and sufficient one.
    impact: >-
      None on the design's contract: no new crate, no second gpui Global, no `crates/zed/src/main.rs`
      line (inventory auto-registers). R1.1 holds — tokens still resolve through the provider.
      Story 006 adds knobs to the `zeo` group; `MergeFrom for Option<T>` merges field-wise, so
      its knobs will not clobber each other.

  - task: "2.1"
    component: "R1.7 clamp test coverage"
    design: "The pre-authored test was expected to cover R1.7 (clamp to 0.5-2.0)."
    actual: >-
      It did NOT. It exercised only the default (1.0) and in-range writes (1.5, 0.5). The
      orchestrator found the gap and directed the Executor to ADD four new `#[gpui::test]`
      functions: below-floor clamps up to 0.5; above-ceiling clamps down to 2.0; the boundaries
      0.5/2.0 are preserved exactly; and `clamp_radius_scale` is total over NaN/inf.
    reason: >-
      R1.7 and D23 would otherwise have shipped UNASSERTED — precisely the "unfalsifiable knob"
      failure D23 exists to prevent ("story 006 must inherit a validated knob, not a raw f32").
      Adding NEW tests is permitted; the frozen-test rule forbids modifying existing assertions,
      not adding coverage. The four original test functions were not touched.
    impact: "Strictly stronger. The clamp is now falsifiable."

  - task: "2.1 / 2.2"
    component: "pre-authored test files — compile-blocking bugs and a wrong harness premise"
    design: "The pre-authored tests were expected to compile and to assert against ui_font_size 16."
    actual: >-
      Three repairs were required across BOTH test files. **Zero assertions or expected values
      were changed in either.**
      (a) `use gpui::UpdateGlobal;` was missing — `SettingsStore::update_global` needs the trait
          in scope (E0599).
      (b) `store.set_user_settings(json, cx)` returns `SettingsParseResult`, NOT a `Result` — it
          has no `.is_ok()`. Translated to
          `!matches!(result.parse_status, ParseStatus::Failed { .. })`, message preserved verbatim.
      (c) THE PREMISE BUG: the gpui test harness pins `ui_font_size` to **14**
          (`crates/settings/src/settings_file.rs:112,139,155`, upstream, Jan 2026), NOT to
          default.json's 16. Both test files were authored believing the harness default was 16.
    reason: >-
      (a) and (b) are plain bugs; the tests' own module docs sanction exactly this repair ("the
      test is broken — fix the test, do not 'fix' it by deleting an assertion").
      (c) is the interesting one. The Executor proposed lowering 2.1's assertion to `px(14.)`.
      The orchestrator REJECTED that: it pins a test-harness artifact as a contract, and it is
      unavailable in 2.2, where the expected values ARE the R1.4 design scale (Md = 6.0) — rewriting
      them to 5.25 would destroy the very scale the test exists to assert. The correct repair is to
      make the SETUP deliver the font size the tests already CLAIM to assert (their labels read
      "@ ui_font_size 16"): pin `"ui_font_size": 16` in the JSON written by `write_user_settings`.
      Applied at one site in 2.1's file and three in 2.2's. Every assertion survives byte-identical.
      SUBTLETY: the pin must be PER-WRITE, not once in `init_test`. `set_user_settings` REPLACES the
      user layer, so a global pin would be dropped by any later write — and `the_scale_is_density_invariant`
      (which reads its baseline before writing, then writes density only) would BREAK. It was
      deliberately left unpinned; it is internally consistent at the harness default.
    impact: >-
      The design's nominal font size (16) is what is tested, rather than a harness artifact that
      upstream may change. Surface-only edits; assertions frozen.
    test_surface_adjusted: true

  - task: "2.2"
    component: "ZeoRadius::Full::rems()"
    design: "D22 — `Full` is a fixed sentinel (px(9999)), exempt from ui_font_size scaling."
    actual: "`Full.rems()` returns `rems(9999 / ui_font_size)`, not a constant."
    reason: >-
      `Rems` is BY CONSTRUCTION a multiple of the rem base. A constant `rems(9999)` would make the
      rems form drift with `ui_font_size` while `px()` stayed flat — i.e. the rems form would
      VIOLATE D22 and disagree with `px()`. Dividing the base back out is what makes both forms
      honour D22 identically.
    impact: >-
      Strengthens the `rems_and_px_agree` invariant to all 8 steps (the test only enumerates the 7
      non-`Full` ones). Contradicts no assertion. Safe from divide-by-zero: `ui_font_size` is clamped
      to a MIN_FONT_SIZE of px(6.0) upstream (`theme_settings/src/settings.rs:402-408`).

