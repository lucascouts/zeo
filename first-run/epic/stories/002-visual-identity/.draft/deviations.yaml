    impact: "Strictly stronger than the mitigation design.md asked for. R3.3 holds with margin."

  - task: "5.1"
    component: "One Light's indigo retired from the syntax palette"
    design: "D14/R3.8 — derive syntax from One Dark, harmonised with the accent; do not author from scratch."
    actual: >-
      Derived as instructed, but One Light's indigo (`#5c78e2`) was RETIRED rather than harmonised, and
