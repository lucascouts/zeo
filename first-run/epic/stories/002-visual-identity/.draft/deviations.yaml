# Deviation register — story 002 (Zeo Visual Identity), Run mode.
# Maintained by the orchestrator; passed as "Project State" to every Executor.

deviations:
  - task: "1.2"
    component: "task ordering (Task 1.2 before Task 3)"
    design: >-
      tasks.md sequences 1.2 ("bank the pre-change baseline") ahead of every visual
      change, on the stated ground that it is IRREVERSIBLE — "once Task 3 lands, the
      'before' cannot be recreated without a checkout and a full rebuild".
    actual: >-
      The pre-change RELEASE binary was banked instead, and the capture deferred to the
      human phase (alongside 7.1). `fork/target/release/zeo` (built 06:28) is hardlinked
      to `.epic/stories/002-visual-identity/baseline-bin/zeo`.
    reason: >-
      The premise is false in this working tree. (a) The binary IS the unchanged "before":
      the only fork commit after it was built (b05f68f9be) touches README.md alone — no
      `crates/` or `assets/` file. (b) `rust-embed` is used WITHOUT the `debug-embed`
      feature (crates/assets/src/assets.rs), so a RELEASE build embeds assets/themes/**
      into the binary. The banked binary therefore renders the pre-change (Zed/One Dark)
      appearance permanently, regardless of what the source tree does next.
      Cost: a hardlink on the same filesystem — 0 bytes. It survives `cargo build` and
      `cargo clean` (cargo unlinks and recreates target/release/zeo; the inode stays alive
      through our link).
    impact: >-
      The irreversibility that forced 1.2 ahead of Task 3 is GONE — the "before" is now
      reproducible on demand. Task 1.2 moves to the human phase and runs together with 7.1,
      which also removes the need to seize the user's live desktop mid-Run. No requirement
      is weakened: R5.1 still gets its before/after pairs from an identical fixture.
    approved_by_user: true

