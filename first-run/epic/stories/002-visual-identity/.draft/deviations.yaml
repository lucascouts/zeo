    component: "test attribute — `#[gpui::test]` -> plain `#[test]`"
    design: 'tasks.md 5.4 Tests: "a new `#[gpui::test]` sweeping 2 border tokens x 4 surface rungs x 2 variants".'
    actual: "All three new tests are plain `#[test]`."
