  - task: "5.1"
    component: "light `info` desaturated AND rotated"
    design: >-
      design.md §Accent: the light accent's 35-degree separation from `info` is tight; "mitigate by
      desaturating `info` in the Zeo light theme".
    actual: "S 0.70 -> 0.47 AND hue 227 -> 204 degrees. Separation goes 35 -> 59 degrees."
    reason: >-
      Desaturation alone leaves the hues 35 degrees apart. The rotation brings the light variant's
      separation in line with dark's 54 degrees, so both variants share one hue architecture
